name: Build docker image

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE: openmethane/openmethane

jobs:
  # A dev-pr pre-release is a model change that hasn't been merged and released
  # yet. It may be pinned in a pull request to test the change in AWS, but must
  # move to a real release before merging.
  no-dev-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Check the Dockerfile pins no dev-pr pre-release
        run: |
          if grep -nE 'releases/download/dev-pr' Dockerfile; then
            echo "::error file=Dockerfile::Pin a released model version instead of a dev-pr pre-release"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          #          - linux/arm64
          - linux/amd64
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      registry-image-id: ${{ steps.remote-image-id.outputs.REMOTE_ID }}
    # Builds and pushes the image
    # Tags the image with the PR that it is linked to
    steps:
      # Setup repo and docker utils
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Login to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version from pyproject.toml
        id: version
        run: |
          PACKAGE_VERSION=$(grep -oP '^version = "\K(.+)(?=")' pyproject.toml)
          echo "version=v$PACKAGE_VERSION" >> $GITHUB_OUTPUT
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE }}"
          # tag as `build-XYZ` since images need to be tagged to push
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=build-${{ github.run_number }}
          # Duplicated from Dockerfile due to https://github.com/docker/metadata-action/issues/295
          labels: |
            org.opencontainers.image.title="Open Methane"
            org.opencontainers.image.description="Open Methane model and tools"
            org.opencontainers.image.authors="Peter Rayner <peter.rayner@superpowerinstitute.com.au>, Jared Lewis <jared.lewis@climate-resource.com>"
            org.opencontainers.image.vendor="The Superpower Institute"

      - name: Build and push image
        uses: docker/build-push-action@v7
        id: build
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            OPENMETHANE_VERSION=${{ steps.version.outputs.version }}
          push: true
          pull: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Construct remote image id
        id: remote-image-id
        run: |
          echo "REMOTE_ID=${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  test-unit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Check built container package version
        if: startsWith(github.event.ref, 'refs/tags/v')
        run: |
          TAG_REF="${{ github.event.ref }}"
          TAG_VERSION=${TAG_REF#"refs/tags/"}
          docker run --rm -e TAG_VERSION=$TAG_VERSION ${{ needs.build.outputs.registry-image-id }} /bin/bash -c $'
            if [ "$OPENMETHANE_VERSION" != "$TAG_VERSION" ]; then
              echo "OPENMETHANE_VERSION is $OPENMETHANE_VERSION; expected version is $TAG_VERSION"
              exit 1
            fi
          '
      - name: Run pytest unit tests
        run: |
          docker run --rm ${{ needs.build.outputs.registry-image-id }} \
            /bin/bash -c $'python -m pytest -r a -v tests/unit'

  test-integration:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up data path
        id: data-path
        run: |
          mkdir $RUNNER_TEMP/data
          # Make the folder writable by user 1000 in the docker container
          sudo chmod a+w $RUNNER_TEMP/data
          echo "DATA_PATH=$RUNNER_TEMP/data" >> $GITHUB_OUTPUT
      - name: Cache test data
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.data-path.outputs.DATA_PATH }}/cams
            ${{ steps.data-path.outputs.DATA_PATH }}/domains
          key: test-data
      - name: Run pytest integration tests
        run: |
          docker run --rm -v ${{ steps.data-path.outputs.DATA_PATH }}:/app/data \
            -e CDSAPI_KEY=${{ secrets.CDSAPI_ADS_KEY }} \
            -e CDSAPI_URL=https://ads.atmosphere.copernicus.eu/api \
            ${{ needs.build.outputs.registry-image-id }} \
            /bin/bash -c $'
              cd /app
              make fetch-test-data
              env
              python -m pytest -r a -v tests/integration/cmaq_preprocess tests/integration/obs_preprocess
            '

  test-e2e:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up data path
        id: data-path
        run: |
          mkdir $RUNNER_TEMP/data
          # Make the folder writable by user 1000 in the docker container
          sudo chmod a+w $RUNNER_TEMP/data
          echo "DATA_PATH=$RUNNER_TEMP/data" >> $GITHUB_OUTPUT
      # --basetemp keeps the test's output in the data path, to upload below
      - name: Run e2e test
        run: |
          docker run --rm -v ${{ steps.data-path.outputs.DATA_PATH }}:/app/data \
            ${{ needs.build.outputs.registry-image-id }} \
            /bin/bash -c $'
              cd /app
              make fetch-test-data
              python -m pytest -r a -v tests/integration/pipeline --basetemp=/app/data/pytest
            '

      - name: Run fourdvar integration tests
        # Skip integration tests that make no assertions
        # @see: https://github.com/openmethane/openmethane/issues/216
        if: false
        run: |
          docker run --rm -v ${{ steps.data-path.outputs.DATA_PATH }}:/app/data \
            -e STORE_PATH=/app/data \
            ${{ needs.build.outputs.registry-image-id }} \
            /bin/bash -c $'
              cd /app
              # This test requires the results from the preprocessing step
              # Verbosity is set to A to show all test results
              python -m pytest -r A -v tests/integration/fourdvar
            '

      # pytest makes its folders readable only by the container's user
      - name: Make the test output readable
        if: ${{ always() }}
        run: |
          if [ -d ${{ steps.data-path.outputs.DATA_PATH }}/pytest ]; then
            sudo chmod -R a+rX ${{ steps.data-path.outputs.DATA_PATH }}/pytest
          fi
      - name: Upload CMAQ artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: ${{ steps.data-path.outputs.DATA_PATH }}/pytest/*/store/
          retention-days: 5

  # Decide which path-dependent jobs to run. Filtering here rather than with
  # on.pull_request.paths means skipped jobs still report to required checks.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      wrf: ${{ steps.filter.outputs.wrf }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Find changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            wrf:
              - 'src/openmethane/wrf/**'
              - 'src/openmethane/util/process.py'
              - 'src/openmethane/util/download.py'
              - 'src/openmethane/util/logging.py'
              - 'tests/unit/wrf/**'
              - 'tests/integration/wrf/**'
              - 'tests/test-data/wrf/**'
              - 'tests/test-data/bundles.yaml'
              - 'tests/conftest.py'
              - 'Dockerfile'
              - 'docker/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/build_docker.yaml'

  # Lint the code written to the project's newer standard. Widen the paths as
  # other modules are brought up to it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Check and format-check with ruff
        run: |
          PATHS="src/openmethane/wrf tests/unit/wrf tests/integration/wrf
            src/openmethane/util/process.py src/openmethane/util/download.py
            src/openmethane/util/logging.py src/openmethane/util/decomposition.py
            tests/unit/util"
          uv run --only-group dev ruff check $PATHS
          uv run --only-group dev ruff format --check $PATHS

  # Run WRF for a real au-test day: the integration test checks the output
  # contract and compares the output with the `wrf` test data bundle, so any
  # change to WRF's output is caught. Runs when WRF paths change, and always on
  # main, tags and manual runs.
  test-wrf:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [ build, changes ]
    if: needs.changes.outputs.wrf == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up data path
        id: data-path
        run: |
          mkdir $RUNNER_TEMP/data
          # Make the folder writable by user 1000 in the docker container
          sudo chmod a+w $RUNNER_TEMP/data
          echo "DATA_PATH=$RUNNER_TEMP/data" >> $GITHUB_OUTPUT
      - name: Restore cached FNL analyses
        id: fnl-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.data-path.outputs.DATA_PATH }}/fnl
          key: wrf-fnl-au-test-2022-12-07
      # --basetemp keeps the test's output in the data path, to upload below
      - name: Run the WRF integration tests
        run: |
          docker run --rm -v ${{ steps.data-path.outputs.DATA_PATH }}:/app/data \
            -e WRF_TEST_FNL_CACHE_PATH=/app/data/fnl \
            ${{ needs.build.outputs.registry-image-id }} \
            python -m pytest -r a -v tests/integration/wrf -m wrf --basetemp=/app/data/pytest
      # Saved even if a later step fails, so the 3 GB isn't downloaded again
      - name: Save FNL analyses to the cache
        if: ${{ always() && steps.fnl-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.data-path.outputs.DATA_PATH }}/fnl
          key: wrf-fnl-au-test-2022-12-07
      # pytest makes its folders readable only by the container's user
      - name: Make the test output readable
        if: ${{ always() }}
        run: |
          if [ -d ${{ steps.data-path.outputs.DATA_PATH }}/pytest ]; then
            sudo chmod -R a+rX ${{ steps.data-path.outputs.DATA_PATH }}/pytest
          fi
      - name: Upload WRF output
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wrf-output
          # met_em names hold colons, which artifacts don't allow
          path: |
            ${{ steps.data-path.outputs.DATA_PATH }}/pytest/*/store/wrf/au-test/*/
            !${{ steps.data-path.outputs.DATA_PATH }}/pytest/*/store/wrf/au-test/metem/
          retention-days: 5

  # Determine additional tags to apply to the image
  image-tags:
    runs-on: ubuntu-latest
    needs: [ test-integration , test-unit, test-e2e ]
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # check if the triggering ref is a vX.Y.Z tag and NOT vX.Y.Za0 (prerelease)
      - name: Check for stable release
        id: check-stable
        if: startsWith(github.event.ref, 'refs/tags/v')
        run: |
          if [[ "${{ github.event.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "STABLE_RELEASE=true" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE }}"
          tags: |
            type=ref,event=pr
            type=pep440,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.event.ref, 'refs/tags/v') }}
            type=raw,value=stable,enable=${{ steps.check-stable.outputs.STABLE_RELEASE == 'true' }}

  tag-image-ghcr:
    runs-on: ubuntu-latest
    needs: [ build, image-tags ]
    if: ${{ needs.image-tags.outputs.tags }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built docker image
        run: |
          docker pull ${{ needs.build.outputs.registry-image-id }}
      - name: Tag and push docker image
        run: |
          TAGS="${{ needs.image-tags.outputs.tags }}"
          
          IFS=$'\n'
          for tag in $TAGS; do
            echo "Tagging ${{ needs.build.outputs.registry-image-id }} as $tag"
            docker tag "${{ needs.build.outputs.registry-image-id }}" "$tag"
            docker push "$tag"
          done
      - name: Remove build tag from published image
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-tags: build-${{ github.run_number }}

  # Push the image to ECR as well
  push-ecr:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        account_id:
          - "654654509571"
          - "058264429703"
        include:
          - account_id: "654654509571"
            aws_access_key_secret: "AWS_ACCESS_KEY_ID_SANDBOX"
            aws_secret_access_key_secret: "AWS_SECRET_ACCESS_KEY_SANDBOX"
          - account_id: "058264429703"
            aws_access_key_secret: "AWS_ACCESS_KEY_ID_PROD"
            aws_secret_access_key_secret: "AWS_SECRET_ACCESS_KEY_PROD"

    needs: [ build, image-tags ]
    if: ${{ needs.image-tags.outputs.tags }}
    permissions:
      contents: read
      packages: read
    env:
      ECR_REGISTRY: ${{ matrix.account_id }}.dkr.ecr.ap-southeast-2.amazonaws.com
    steps:
      - name: Login to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        # TODO: Use the OIDC token instead of the access key
        with:
          aws-access-key-id: ${{ secrets[matrix.aws_access_key_secret] }}
          aws-secret-access-key: ${{ secrets[matrix.aws_secret_access_key_secret] }}
          aws-region: ap-southeast-2
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull built docker image
        run: |
          docker pull "${{ needs.build.outputs.registry-image-id }}"
      - name: Tag and push docker image to Amazon ECR
        # Replace the ghcr.io portion of the tags with the ECR URL so the tags
        # are pushed to the right registry
        run: |
          TAGS="${{ needs.image-tags.outputs.tags }}"
          
          IFS=$'\n'
          for tag in $TAGS; do
            ECR_TAG=${tag/"${{ env.REGISTRY }}"/"${{ env.ECR_REGISTRY }}"}
            echo "Tagging ${{ needs.build.outputs.registry-image-id }} as $ECR_TAG"
            docker tag "${{ needs.build.outputs.registry-image-id }}" "$ECR_TAG"
            docker push "$ECR_TAG"
          done
